name: Release

# Push a tag like v0.5.0 to build installers for macOS, Windows and Linux and attach them to a
# draft GitHub release. Signing is optional: add the secrets below and builds are signed (and
# notarised on macOS); without them they are unsigned.
#
#   macOS:   MAC_CSC_LINK (base64 .p12 of a "Developer ID Application" cert), MAC_CSC_KEY_PASSWORD,
#            APPLE_API_KEY_BASE64 (base64 .p8), APPLE_API_KEY_ID, APPLE_API_ISSUER,
#            MAC_CSC_INSTALLER_LINK + MAC_CSC_INSTALLER_KEY_PASSWORD ("Developer ID Installer" .p12, signs the .pkg)
#   Windows: WIN_CSC_LINK (base64 .pfx), WIN_CSC_KEY_PASSWORD
#            or Azure Trusted Signing: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET (secrets) and
#            AZURE_TRUSTED_SIGNING_ENDPOINT / _ACCOUNT / _PROFILE / _PUBLISHER (repository variables)
#
# Every macOS build is checked before upload: the app's signature must verify, and when it was
# signed and notarised, Gatekeeper must accept it and the notarisation ticket must be stapled.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac --arm64 --x64
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Configure code signing (only when secrets are set)
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MAC_CSC_INSTALLER_LINK: ${{ secrets.MAC_CSC_INSTALLER_LINK }}
          MAC_CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.MAC_CSC_INSTALLER_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}
          AZURE_TRUSTED_SIGNING_PUBLISHER: ${{ vars.AZURE_TRUSTED_SIGNING_PUBLISHER }}
        run: |
          # electron-builder treats an empty CSC_LINK as an error, so only export what exists.
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "$MAC_CSC_LINK" ]; then
              echo "CSC_LINK=$MAC_CSC_LINK" >> "$GITHUB_ENV"
              echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            else
              echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            fi
            if [ -n "$APPLE_API_KEY_BASE64" ]; then
              echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
              echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
              echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
            fi
            if [ -n "$MAC_CSC_INSTALLER_LINK" ]; then
              echo "CSC_INSTALLER_LINK=$MAC_CSC_INSTALLER_LINK" >> "$GITHUB_ENV"
              echo "CSC_INSTALLER_KEY_PASSWORD=$MAC_CSC_INSTALLER_KEY_PASSWORD" >> "$GITHUB_ENV"
            fi
          fi
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$WIN_CSC_LINK" ]; then
            echo "WIN_CSC_LINK=$WIN_CSC_LINK" >> "$GITHUB_ENV"
            echo "WIN_CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$AZURE_TRUSTED_SIGNING_ENDPOINT" ] && [ -n "$AZURE_CLIENT_SECRET" ]; then
            for v in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TRUSTED_SIGNING_ENDPOINT AZURE_TRUSTED_SIGNING_ACCOUNT AZURE_TRUSTED_SIGNING_PROFILE AZURE_TRUSTED_SIGNING_PUBLISHER; do
              echo "$v=${!v}" >> "$GITHUB_ENV"
            done
          fi

      - run: npx electron-builder --config electron-builder.config.cjs ${{ matrix.target }} --publish never

      # A broken signature makes macOS call the download "damaged" with no way to open it, so a
      # build that doesn't verify never reaches the release.
      - name: Verify macOS signatures (and notarise the .pkg)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          for app in dist/mac*/ApiMan.app; do
            echo "::group::$app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv --verbose=2 "$app" 2>&1 | grep -E 'Identifier|Authority|TeamIdentifier|Signature|flags'
            if [ -n "${APPLE_API_KEY:-}" ]; then
              spctl --assess --type execute --verbose=2 "$app"
              xcrun stapler validate "$app"
            fi
            echo "::endgroup::"
          done
          for pkg in dist/*.pkg; do
            pkgutil --check-signature "$pkg" || true
            # electron-builder notarises the app only; a signed .pkg is notarised and stapled here.
            if [ -n "${CSC_INSTALLER_LINK:-}" ] && [ -n "${APPLE_API_KEY:-}" ]; then
              xcrun notarytool submit "$pkg" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
              xcrun stapler staple "$pkg"
              spctl --assess --type install --verbose=2 "$pkg"
            fi
          done

      # Supply-chain artefacts for security reviews: SHA-256 checksums of every installer and a
      # CycloneDX SBOM of the runtime dependencies.
      - name: Checksums
        shell: bash
        run: node -e "const fs=require('fs'),c=require('crypto');const f=fs.readdirSync('dist').filter(n=>/\.(dmg|zip|pkg|exe|AppImage|deb)$/.test(n));fs.writeFileSync('dist/SHA256SUMS-${{ runner.os }}.txt',f.map(n=>c.createHash('sha256').update(fs.readFileSync('dist/'+n)).digest('hex')+'  '+n).join('\n')+'\n')"
      - name: SBOM
        if: runner.os == 'Linux'
        run: npm sbom --omit=dev --sbom-format cyclonedx > dist/apiman-sbom.cdx.json

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            dist/*.dmg
            dist/*.pkg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
            dist/SHA256SUMS-*.txt
            dist/apiman-sbom.cdx.json
